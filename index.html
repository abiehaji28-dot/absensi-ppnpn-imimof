<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>ABSENSI PPNPN IMIMOF</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

body {
    background: #f1f5f9;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.container {
    width: 100%;
    max-width: 420px;
    background: white;
    padding: 30px 25px;
    border-radius: 15px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.15);
}

h1 {
    text-align: center;
    font-size: 22px;
    color: #0f172a;
    margin-bottom: 10px;
}

.subtitle {
    text-align: center;
    color: #64748b;
    font-size: 14px;
    margin-bottom: 25px;
}

input {
    width: 100%;
    padding: 14px;
    margin-bottom: 15px;
    border: 1px solid #cbd5e1;
    border-radius: 8px;
    font-size: 16px;
    outline: none;
}

input:focus {
    border-color: #2563eb;
}

button {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 8px;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    margin-top: 8px;
}

.loginBtn {
    background: #2563eb;
}

.masukBtn {
    background: #16a34a;
}

.pulangBtn {
    background: #dc2626;
}

.logout {
    background: #475569;
    margin-top: 20px;
}

button:active {
    transform: scale(0.98);
}

.hidden {
    display: none;
}

.info {
    background: #f8fafc;
    padding: 15px;
    border-radius: 8px;
    margin: 20px 0;
    line-height: 1.9;
}

.location {
    margin-top: 15px;
    padding: 15px;
    background: #eff6ff;
    border-radius: 8px;
    font-size: 14px;
    line-height: 1.8;
    word-break: break-word;
}

.status {
    text-align: center;
    margin-top: 15px;
    font-weight: bold;
    line-height: 1.5;
}

.success {
    color: green;
}

.error {
    color: red;
}

.absenStatus {
    margin-top: 20px;
    padding: 15px;
    background: #f8fafc;
    border-radius: 8px;
    line-height: 1.8;
}

</style>

</head>

<body>

<div class="container">


<!-- =========================
     LOGIN
========================= -->

<div id="loginPage">

<h1>
ABSENSI PPNPN IMIMOF
</h1>

<p class="subtitle">
Silakan login untuk melakukan absensi
</p>

<input
type="text"
id="nama"
placeholder="Masukkan Nama Lengkap">

<input
type="text"
id="username"
placeholder="Username">

<input
type="password"
id="password"
placeholder="Password">

<button
class="loginBtn"
onclick="login()">

LOGIN

</button>

<p
id="loginStatus"
class="status">
</p>

</div>


<!-- =========================
     HALAMAN ABSENSI
========================= -->

<div
id="absenPage"
class="hidden">

<h1>
ABSENSI PPNPN IMIMOF
</h1>

<p class="subtitle">
Sistem Absensi Digital
</p>


<!-- INFORMASI PEGAWAI -->

<div class="info">

<b>Nama:</b>
<span id="namaUser"></span>

<br>

<b>Username:</b>
<span id="userLogin"></span>

<br>

<b>Tanggal:</b>
<span id="tanggal"></span>

<br>

<b>Jam:</b>
<span id="jam"></span>

</div>


<!-- ABSEN MASUK -->

<button
class="masukBtn"
onclick="absen('masuk')">

🟢 ABSEN MASUK

</button>


<!-- ABSEN PULANG -->

<button
class="pulangBtn"
onclick="absen('pulang')">

🔴 ABSEN PULANG

</button>


<!-- INFORMASI GPS -->

<div
id="locationInfo"
class="location hidden">

<b>📍 Lokasi GPS</b>

<br><br>

Latitude:
<span id="latitude"></span>

<br>

Longitude:
<span id="longitude"></span>

<br>

Akurasi:
<span id="akurasi"></span>
meter

</div>


<!-- STATUS ABSENSI -->

<div
id="absenStatus"
class="absenStatus">

Belum melakukan absensi.

</div>


<!-- LOGOUT -->

<button
class="logout"
onclick="logout()">

LOGOUT

</button>

</div>

</div>


<script>


/* =========================
   AKUN LOGIN
========================= */

const akun = {

username: "ppnpn",

password: "123456"

};


/* =========================
   LOGIN
========================= */

function login() {

const nama =
document
.getElementById("nama")
.value
.trim();

const username =
document
.getElementById("username")
.value
.trim();

const password =
document
.getElementById("password")
.value;

const status =
document
.getElementById("loginStatus");


if (nama === "") {

status.textContent =
"Silakan masukkan nama lengkap.";

status.className =
"status error";

return;

}


if (
username === akun.username &&
password === akun.password
) {

document
.getElementById("loginPage")
.classList
.add("hidden");

document
.getElementById("absenPage")
.classList
.remove("hidden");


document
.getElementById("namaUser")
.textContent =
nama;


document
.getElementById("userLogin")
.textContent =
username;


tampilkanWaktu();

}

else {

status.textContent =
"Username atau password salah!";

status.className =
"status error";

}

}


/* =========================
   WAKTU
========================= */

function tampilkanWaktu() {

const sekarang =
new Date();

document
.getElementById("tanggal")
.textContent =
sekarang
.toLocaleDateString("id-ID");

document
.getElementById("jam")
.textContent =
sekarang
.toLocaleTimeString("id-ID");

}

setInterval(
tampilkanWaktu,
1000
);


/* =========================
   ABSEN
========================= */

function absen(jenis) {

const status =
document
.getElementById("absenStatus");


if (!navigator.geolocation) {

status.innerHTML =
"❌ GPS tidak didukung.";

return;

}


status.innerHTML =
"📍 Sedang mengambil lokasi GPS...";


navigator
.geolocation
.getCurrentPosition(

function(position) {


const latitude =
position.coords.latitude;

const longitude =
position.coords.longitude;

const akurasi =
position.coords.accuracy;


document
.getElementById("latitude")
.textContent =
latitude.toFixed(6);


document
.getElementById("longitude")
.textContent =
longitude.toFixed(6);


document
.getElementById("akurasi")
.textContent =
Math.round(akurasi);


document
.getElementById("locationInfo")
.classList
.remove("hidden");


const waktu =
new Date()
.toLocaleTimeString(
"id-ID"
);

const tanggal =
new Date()
.toLocaleDateString(
"id-ID"
);


const nama =
document
.getElementById("namaUser")
.textContent;


if (jenis === "masuk") {

status.innerHTML =

"🟢 <b>ABSEN MASUK BERHASIL</b><br><br>" +

"Nama: " + nama +

"<br>Tanggal: " + tanggal +

"<br>Jam: " + waktu +

"<br>Latitude: " +
latitude.toFixed(6) +

"<br>Longitude: " +
longitude.toFixed(6);

}

else {

status.innerHTML =

"🔴 <b>ABSEN PULANG BERHASIL</b><br><br>" +

"Nama: " + nama +

"<br>Tanggal: " + tanggal +

"<br>Jam: " + waktu +

"<br>Latitude: " +
latitude.toFixed(6) +

"<br>Longitude: " +
longitude.toFixed(6);

}


},

function(error) {


if (error.code === 1) {

status.innerHTML =
"❌ Izin lokasi ditolak. Silakan izinkan lokasi.";

}

else if (error.code === 2) {

status.innerHTML =
"❌ Lokasi tidak tersedia. Aktifkan GPS.";

}

else if (error.code === 3) {

status.innerHTML =
"❌ Waktu mengambil lokasi habis. Coba lagi.";

}

else {

status.innerHTML =
"❌ Gagal mengambil lokasi.";

}

},

{

enableHighAccuracy: true,

timeout: 15000,

maximumAge: 0

}

);

}


/* =========================
   LOGOUT
========================= */

function logout() {

document
.getElementById("absenPage")
.classList
.add("hidden");

document
.getElementById("loginPage")
.classList
.remove("hidden");


document
.getElementById("nama")
.value = "";

document
.getElementById("username")
.value = "";

document
.getElementById("password")
.value = "";


document
.getElementById("absenStatus")
.innerHTML =
"Belum melakukan absensi.";

}

</script>

</body>

</html>
